org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ---------------------------------------------------------------
# 关闭 Kotlin 增量编译（Windows 上的已知问题）
#
# 症状：某些插件的 compileDebugKotlin 任务报
#   "Could not close incremental caches in .../caches-jvm/jvm/kotlin:
#    class-fq-name-to-source.tab, source-to-classes.tab, ..."
#
# 原因是增量编译缓存的 .tab 文件被占用（杀毒软件扫描、
# 上一次构建的守护进程没退干净、或构建被中断）。
# `flutter clean` 解决不了，因为缓存可能在 Gradle 的
# 共享目录里而不在 build/ 下。
#
# 代价：Kotlin 编译每次全量，构建慢一些。
# 换来的是**构建不再随机失败**——对开发体验来说这笔交易划算。
#
# 想恢复增量编译时删掉这两行即可（并确保没有杀软扫描 build 目录）。
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
